<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shop - Recover Username</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 20px;
        }

        .login-box {
            background: #111827;
            border: 2px solid #38bdf8;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35), inset 0 0 15px rgba(56, 189, 248, 0.1);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 28px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            margin-bottom: 6px;
        }

        .login-box h3 {
            font-size: 16px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }

        .login-box form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .login-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            background: #111827;
        }

        .login-box input::placeholder {
            color: #6b7280;
        }

        .login-box button {
            margin-top: 10px;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transition: all 0.25s ease;
        }

        .login-box button:hover {
            background: linear-gradient(135deg, #1d4ed8, #0369a1);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
            transform: translateY(-1px);
        }

        .login-box a {
            color: #38bdf8 !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .login-box a:hover {
            color: #7dd3fc !important;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Mobile Shop</h1>
    <h3>Recover Username</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="text"
            name="email"
            placeholder="Email (agar set kiya ho)"
        >

        <input
            type="text"
            name="current_username"
            placeholder="Current Username (agar yaad ho)"
        >

        <input
            type="text"
            name="recovery_code"
            placeholder="Recovery Code"
            required
        >

        <input
            type="text"
            name="new_username"
            placeholder="New Username"
            required
        >

        <button type="submit">Set New Username</button>

    </form>

    <p style="text-align:center; margin-top:20px;">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </p>

</div>

</body>
</html>
