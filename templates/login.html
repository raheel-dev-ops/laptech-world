<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shop - Login</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #05070d;
            --panel: #0f1729;
            --panel-2: #0a1120;
            --border: #38bdf8;
            --accent: #38bdf8;
            --accent-2: #2563eb;
            --text: #e5e7eb;
            --muted: #8ea0c4;
            --danger: #f87171;
            --success: #4ade80;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(56, 189, 248, 0.12),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 80% 100%,
                    rgba(37, 99, 235, 0.10),
                    transparent 45%
                );
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }


        /* =====================================================
           BACKGROUND LOGO
           ===================================================== */

        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;

            width: 640px;
            height: 640px;

            max-width: 140vw;
            max-height: 140vw;

            transform: translate(-50%, -50%);

            /* Background logo slightly brighter */
            opacity: 0.25;

            /* Blue glow around background logo */
            filter:
                brightness(1.15)
                saturate(1.5)
                blur(0.5px)
                drop-shadow(0 0 30px rgba(0, 150, 255, 0.55))
                drop-shadow(0 0 70px rgba(0, 120, 255, 0.35));

            pointer-events: none;
            z-index: 0;

            border-radius: 50%;
            object-fit: cover;
        }


        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-box {
            position: relative;
            z-index: 1;

            width: 380px;
            max-width: 90vw;

            padding: 38px 32px;

            background: rgba(15, 23, 41, 0.9);

            backdrop-filter: blur(6px);

            border: 2px solid var(--border);
            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.6),
                0 0 70px rgba(56, 189, 248, 0.35),
                0 0 120px rgba(56, 189, 248, 0.15);
        }


        /* =====================================================
           MAIN LOGO
           Brightness INSIDE + Neon Glow OUTSIDE
           ===================================================== */

        .login-box .mini-logo {
            width: 130px;
            height: 130px;

            display: block;

            margin: 0 auto 16px;

            /*
             * brightness()
             * Makes the actual logo light brighter.
             *
             * contrast()
             * Makes the bright areas stand out more.
             *
             * saturate()
             * Makes the blue color stronger.
             */

            filter:
                brightness(1.6)
                contrast(1.15)
                saturate(2.2)

                /* Inner/near blue glow */
                drop-shadow(
                    0 0 8px
                    rgba(0, 190, 255, 1)
                )

                /* Strong blue glow */
                drop-shadow(
                    0 0 18px
                    rgba(0, 174, 255, 1)
                )

                /* Larger glow */
                drop-shadow(
                    0 0 35px
                    rgba(0, 150, 255, 0.9)
                )

                /* Outer neon light */
                drop-shadow(
                    0 0 55px
                    rgba(0, 130, 255, 0.75)
                )

                /* Wide soft blue halo */
                drop-shadow(
                    0 0 80px
                    rgba(0, 110, 255, 0.5)
                );

            border-radius: 50%;
            object-fit: cover;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .login-box h1 {
            margin: 0 0 2px;

            font-size: 27px;
            font-weight: 800;

            color: #7dd3fc;

            filter:
                drop-shadow(
                    0 2px 8px
                    rgba(0, 0, 0, 0.7)
                )
                drop-shadow(
                    0 0 22px
                    rgba(56, 189, 248, 0.9)
                )
                drop-shadow(
                    0 0 40px
                    rgba(56, 189, 248, 0.6)
                );
        }


        /* =====================================================
           SUB TITLE
           ===================================================== */

        .login-box h3 {
            margin: 0 0 24px;

            font-weight: 500;
            font-size: 12.5px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: var(--muted);
        }


        /* =====================================================
           INPUT FIELDS
           ===================================================== */

        .login-box input {
            width: 100%;

            padding: 13px 14px;

            margin: 8px 0;

            background: var(--panel-2);

            border: 2px solid var(--border);

            border-radius: 10px;

            color: var(--text);

            font-family: inherit;
            font-size: 14px;

            outline: none;
        }


        .login-box input::placeholder {
            color: #5c6b85;
        }


        .login-box input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(56, 189, 248, 0.25);
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .login-box button {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-family: inherit;

            font-weight: 700;
            font-size: 14.5px;

            background:
                linear-gradient(
                    90deg,
                    var(--accent-2),
                    var(--accent)
                );

            color: #04101f;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .login-box button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 22px
                rgba(56, 189, 248, 0.35);
        }


        /* =====================================================
           ERROR MESSAGE
           ===================================================== */

        .login-box .error {
            color: var(--danger);

            font-size: 13px;

            margin: 0 0 12px;

            background:
                rgba(248, 113, 113, 0.1);

            border:
                1px solid
                rgba(248, 113, 113, 0.25);

            padding: 9px 12px;

            border-radius: 8px;
        }


        /* =====================================================
           LOGIN LINKS
           ===================================================== */

        .login-links {
            margin-top: 20px;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .login-links a {
            color: var(--muted);

            font-size: 12.5px;

            text-decoration: none;
        }


        .login-links a:hover {
            color: var(--accent);

            text-decoration: underline;
        }

    </style>
</head>


<body>


    <!-- =====================================================
         BACKGROUND LOGO
         ===================================================== -->

    <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt=""
        class="bg-logo"
    >


    <!-- =====================================================
         LOGIN CARD
         ===================================================== -->

    <div class="login-box">


        <!-- =================================================
             MAIN LOGO
             ================================================= -->

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="Laptech World"
            class="mini-logo"
        >


        <!-- =================================================
             TITLE
             ================================================= -->

        <h1>Laptech World</h1>

        <h3>Management System</h3>


        <!-- =================================================
             FLASK FLASH MESSAGES
             ================================================= -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <p class="error">
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- =================================================
             ERROR
             ================================================= -->

        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <!-- =================================================
             LOGIN FORM
             ================================================= -->

        <form method="POST">


           <!-- Username or Email -->

            <input
                type="text"
                name="username"
                placeholder="Username or Email"
                required
            >


            <!-- Password -->

            <div style="position:relative;">

                <input
                    type="password"
                    name="password"
                    id="login_password"
                    placeholder="Password"
                    required
                    style="padding-right:44px;"
                >


                <!-- Eye Icon -->

                <span
                    onclick="togglePassword('login_password', this)"
                    style="
                        position:absolute;
                        right:12px;
                        top:50%;
                        transform:translateY(-50%);
                        cursor:pointer;
                        font-size:16px;
                    "
                >
                    👁️
                </span>

            </div>


            <!-- Login Button -->

            <button type="submit">
                Login
            </button>


        </form>


        <!-- =================================================
             FORGOT LINKS
             ================================================= -->

        <div class="login-links">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

            <a href="{{ url_for('forgot_username') }}">
                Forgot Username?
            </a>

        </div>


    </div>


    <!-- =====================================================
         PASSWORD TOGGLE
         ===================================================== -->

    <script>

        function togglePassword(inputId, icon) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                icon.textContent = "🙈";

            } else {

                input.type = "password";

                icon.textContent = "👁️";

            }

        }

    </script>


</body>
</html>
