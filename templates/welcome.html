<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Laptech World</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #05070d;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated glowing background blobs */

        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }

        .bg-glow.one {
            width: 420px;
            height: 420px;
            background: #2563eb;
            top: -100px;
            left: -100px;
        }

        .bg-glow.two {
            width: 480px;
            height: 480px;
            background: #38bdf8;
            bottom: -140px;
            right: -120px;
            animation-delay: 2s;
        }

        .bg-glow.three {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-25px) scale(1.08); }
        }

        /* Particle stars */

        .star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #38bdf8;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 3s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* Main splash content */

        .splash {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .splash img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            animation: logoAppear 1.3s ease-out forwards, glow 2.4s ease-in-out infinite 1.3s;
        }

        .splash h1 {
            margin: 26px 0 8px;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(56,189,248,0.6);
            overflow: hidden;
        }

        .word {
            display: inline-block;
            opacity: 0;
        }

        .word.w1 {
            animation: slideInLeft 0.7s ease-out forwards;
            animation-delay: 1.1s;
        }

        .word.w2 {
            animation: slideInLeft 0.7s ease-out forwards;
            animation-delay: 1.4s;
        }

        .word.w3 {
            animation: slideInRight 0.7s ease-out forwards;
            animation-delay: 1.7s;
            color: #38bdf8;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-150px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(150px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .splash .tagline {
            margin: 0;
            color: #9db3d9;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0;
            animation: appear 1s ease-out forwards;
            animation-delay: 2.3s;
        }

        .welcome-text {
            margin-top: 32px;
            font-size: 18px;
            color: #ffffff;
            font-weight: 500;
            opacity: 0;
            animation: appear 1s ease-out forwards;
            animation-delay: 2.7s;
        }

        .welcome-text span {
            color: #38bdf8;
            font-weight: 700;
        }

        .continue-btn {
            margin-top: 34px;
            display: inline-block;
            padding: 14px 36px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            color: #04101f;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            opacity: 0;
            animation: appear 1s ease-out forwards;
            animation-delay: 3.1s;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(56,189,248,0.4);
        }

        /* Progress bar */

        .progress-wrap {
            margin-top: 26px;
            width: 260px;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: appear 1s ease-out forwards;
            animation-delay: 2.9s;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            animation: fillProgress 7s linear forwards;
        }

        .progress-label {
            margin-top: 10px;
            font-size: 11.5px;
            color: #6b7ea3;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: appear 1s ease-out forwards;
            animation-delay: 2.9s;
        }

        @keyframes fillProgress {
            from { width: 0%; }
            to { width: 100%; }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes logoAppear {
            from {
                opacity: 0;
                transform: scale(0.6) rotate(-8deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(56,189,248,0.4));
            }
            50% {
                filter: drop-shadow(0 0 45px rgba(56,189,248,0.85));
            }
        }

    </style>
</head>

<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>
<div class="bg-glow three"></div>

<div id="stars"></div>

<div class="splash">

    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Laptech World">

    <h1>
        <span class="word w1">Welcome</span>
        <span class="word w2">to</span>
        <span class="word w3">Laptech World</span>
    </h1>

    <p class="tagline">Empowering Your Digital Life</p>

    <div class="welcome-text">
        Welcome back, <span>{{ current_user.username }}</span> 👋
    </div>

    <div class="progress-wrap">
        <div class="progress-bar"></div>
    </div>
    <div class="progress-label">Loading your dashboard...</div>

    <br>

    <a href="{{ url_for('dashboard') }}" class="continue-btn" onclick="goNow(event)">
        Continue to Dashboard →
    </a>

</div>

<script>

    // Generate random background stars
    const starsContainer = document.getElementById("stars");

    for (let i = 0; i < 40; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.top = Math.random() * 100 + "vh";
        star.style.left = Math.random() * 100 + "vw";
        star.style.animationDelay = (Math.random() * 3) + "s";
        starsContainer.appendChild(star);
    }

    // Play a single soft "ting" note
    let audioCtx = null;

    function playNote(freq, startDelay) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "sine";
            osc.frequency.value = freq;

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const startTime = audioCtx.currentTime + startDelay;

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.16, startTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);

            osc.start(startTime);
            osc.stop(startTime + 0.5);
        } catch (e) {
            // Audio not supported or blocked — fail silently
        }
    }

    // Sync one chime note to each word appearing
    playNote(523.25, 1.1);  // "Welcome"  (C5)
    playNote(659.25, 1.4);  // "to"       (E5)
    playNote(783.99, 1.7);  // "Laptech World" (G5)

    let redirected = false;

    function goNow(event) {
        event.preventDefault();
        redirected = true;
        window.location.href = "{{ url_for('dashboard') }}";
    }

    // Auto redirect after 7 seconds
    setTimeout(function() {
        if (!redirected) {
            window.location.href = "{{ url_for('dashboard') }}";
        }
    }, 7000);

</script>

</body>
</html>
